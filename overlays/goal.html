<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Member Goal Bar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@500;700&display=swap" rel="stylesheet">
<style>
  /* OBS browser source: 800 x 150, transparent. Add ?demo=1 to preview with fake numbers. */
  :root { --red: #dc1e28; --ink: #ffffff; --dim: rgba(255,255,255,.62); --panel: rgba(10,10,12,.86); --track: rgba(255,255,255,.12); }
  html, body { margin: 0; background: transparent; overflow: hidden; }
  body { font-family: Inter, system-ui, sans-serif; color: var(--ink); width: 800px; height: 150px; }
  .card { position: absolute; left: 16px; right: 16px; top: 16px; padding: 14px 20px 14px; background: var(--panel);
          border-left: 6px solid var(--red); border-radius: 4px; box-shadow: 0 6px 24px rgba(0,0,0,.45); }
  .top { display: flex; align-items: baseline; justify-content: space-between; gap: 16px; }
  .kicker { font-family: Anton, Impact, sans-serif; font-size: 26px; letter-spacing: .04em; text-transform: uppercase; }
  .kicker b { color: var(--red); font-weight: 400; }
  .count { font-family: Anton, Impact, sans-serif; font-size: 34px; font-variant-numeric: tabular-nums; }
  .count small { font-size: 22px; color: var(--dim); }
  .bar { position: relative; height: 16px; margin: 8px 0 8px; background: var(--track); border-radius: 8px; overflow: hidden; }
  .fill { position: absolute; inset: 0 auto 0 0; width: 0; background: linear-gradient(90deg, #a5121b, var(--red));
          border-radius: 8px; transition: width 1.6s cubic-bezier(.2,.8,.2,1); }
  .fill::after { content: ""; position: absolute; inset: 0; background: linear-gradient(90deg, transparent, rgba(255,255,255,.35), transparent);
                 transform: translateX(-100%); animation: sheen 3.2s ease-in-out infinite; }
  @keyframes sheen { 60%, 100% { transform: translateX(100%); } }
  .next { font-size: 17px; font-weight: 500; color: var(--dim); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .next strong { color: var(--ink); font-weight: 700; }
  .pop { position: absolute; right: 26px; top: -6px; font-family: Anton, Impact, sans-serif; font-size: 30px; color: var(--red);
         opacity: 0; pointer-events: none; }
  .pop.go { animation: pop 1.8s ease-out; }
  @keyframes pop { 0% { opacity: 0; transform: translateY(14px); } 20% { opacity: 1; } 100% { opacity: 0; transform: translateY(-26px); } }
  .card.hit { animation: hit 1.2s ease-out; }
  @keyframes hit { 0% { box-shadow: 0 0 0 0 rgba(220,30,40,.9); } 100% { box-shadow: 0 0 0 26px rgba(220,30,40,0); } }
  .hidden { opacity: 0; }
</style>
</head>
<body>
  <div class="card hidden" id="card">
    <div class="pop" id="pop">+1</div>
    <div class="top">
      <div class="kicker">Member goal <b>·</b> Only Friends</div>
      <div class="count"><span id="n">0</span> <small>/ <span id="goal">100</span></small></div>
    </div>
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="next" id="next">Join with the button under the video</div>
  </div>
<script src="feed.js"></script>
<script>
  const $ = id => document.getElementById(id);
  let last = null;
  OFFeed(d => {
    const m = d.members || 0, g = d.goal || {}, next = g.next;
    const from = g.from || 0, to = next ? next.at : (from || m || 1);
    const pct = next ? Math.max(2, Math.min(100, ((m - from) / (to - from)) * 100)) : 100;
    $("card").classList.remove("hidden");
    $("n").textContent = m;
    $("goal").textContent = next ? next.at : "✓";
    $("fill").style.width = pct + "%";
    $("next").innerHTML = next
      ? `<strong>${next.at - m} to go:</strong> ${esc(next.label)}`
      : `<strong>Every goal hit.</strong> Thank you, members.`;
    if (last !== null && m > last) {
      const p = $("pop"); p.textContent = "+" + (m - last); p.classList.remove("go"); void p.offsetWidth; p.classList.add("go");
      const c = $("card"); c.classList.remove("hit"); void c.offsetWidth; c.classList.add("hit");
    }
    last = m;
  });
  function esc(s) { return String(s || "").replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c])); }
</script>
</body>
</html>
